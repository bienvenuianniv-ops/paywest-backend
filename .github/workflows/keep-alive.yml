name: Keep Render service awake

on:
  schedule:
    # Toutes les 5 minutes — marge de securite sous le seuil de 15 min de mise
    # en veille Render (GitHub peut retarder les crons de quelques minutes,
    # surtout aux heures rondes que ce planning declenche a chaque fois)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping l'API PayWest
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 300 https://paywest-backend-1.onrender.com/)
          echo "Statut HTTP: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Le ping a renvoye un statut $status au lieu de 200"
            exit 1
          fi
